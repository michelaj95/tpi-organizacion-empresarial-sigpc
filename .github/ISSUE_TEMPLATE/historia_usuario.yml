name: Historia de usuario
description: Registrar una necesidad funcional del SIGPC
title: "[HU] "
labels:
  - historia-de-usuario
body:
  - type: textarea
    id: historia
    attributes:
      label: Historia
      description: "Usar el formato: Como [usuario], quiero [funcionalidad], para [beneficio]."
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Enumerar condiciones observables y verificables.
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - Alta
        - Media
        - Baja
    validations:
      required: true
  - type: input
    id: estimacion
    attributes:
      label: Estimación
      description: Puntos de historia previstos.
    validations:
      required: true

